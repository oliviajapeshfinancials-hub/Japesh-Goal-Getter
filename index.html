<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goal Getter: Module 4 Online Lesson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --burg:#7B1E3A; --burg-d:#5c1229; --gold:#C9A227; --gold-l:#f3e3a6; --beige:#F5EFE0; --cream:#fffaf0;
  --teal:#1f7a74; --orange:#d9772b; --ink:#2b1a1f; --muted:#6f5d61; --ok:#2e7d4f; --bad:#b3362f;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--beige);color:var(--ink);font-family:Lato,Calibri,sans-serif;font-size:18px;line-height:1.5}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;color:var(--burg);margin:.2em 0 .4em;line-height:1.2}
h1{font-size:2.2rem} h2{font-size:1.75rem} h3{font-size:1.25rem}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
.wrap{max-width:960px;margin:0 auto;padding:16px 18px 120px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--burg);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top-in{max-width:960px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:"Playfair Display",serif;font-weight:800;font-size:1.1rem;letter-spacing:.3px}
.brand small{display:block;font-family:Lato;font-weight:400;font-size:.72rem;opacity:.85;letter-spacing:.5px}
.stars{margin-left:auto;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:4px 14px;font-weight:900;white-space:nowrap}
.stars b{color:var(--gold)}
.tbtn{background:transparent;border:1.5px solid var(--gold);color:var(--gold);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:700}
.tbtn.on{background:var(--gold);color:var(--burg-d)}
.prog{height:6px;background:rgba(255,255,255,.18)}
.prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .4s}

/* map */
.map{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 6px}
.dot{border:2px solid var(--burg);background:#fff;color:var(--burg);border-radius:999px;padding:3px 11px;font-size:.78rem;font-weight:700}
.dot.cur{background:var(--burg);color:#fff}
.dot.done{background:var(--gold-l);border-color:var(--gold);color:var(--burg-d)}

.card{background:#fff;border-radius:18px;padding:22px 24px;box-shadow:0 4px 18px rgba(91,18,41,.08);margin:14px 0;border:1px solid #ecdcc4}
.kicker{display:inline-block;background:var(--gold);color:var(--burg-d);font-weight:900;font-size:.75rem;letter-spacing:1px;text-transform:uppercase;border-radius:6px;padding:3px 9px}
.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.pill{font-size:.8rem;border-radius:999px;padding:2px 10px;background:var(--beige);color:var(--muted);font-weight:700}
.lead{font-size:1.1rem}
.big-quote{font-family:"Playfair Display",serif;font-size:1.35rem;color:var(--burg);border-left:5px solid var(--gold);padding:6px 14px;margin:12px 0;background:var(--cream);border-radius:0 10px 10px 0}

/* trainer notes */
.notes{display:none;background:#fff8e1;border:2px dashed var(--gold);border-radius:14px;padding:14px 18px;margin:14px 0;font-size:.95rem}
body.teacher .notes{display:block}
.notes h4{margin:0 0 6px;color:var(--burg);font-family:Lato;font-weight:900;font-size:.85rem;letter-spacing:1px;text-transform:uppercase}
.notes p{margin:.3em 0}

/* buttons */
.btn{border:none;border-radius:12px;padding:12px 20px;font-weight:900;background:var(--burg);color:#fff;box-shadow:0 3px 0 var(--burg-d);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--burg-d)}
.btn.gold{background:var(--gold);color:var(--burg-d);box-shadow:0 3px 0 #9c7c17}
.btn.ghost{background:#fff;color:var(--burg);border:2px solid var(--burg);box-shadow:none}
.btn:disabled{opacity:.4;cursor:default}
.navbar{position:fixed;left:0;right:0;bottom:0;background:rgba(245,239,224,.96);border-top:1px solid #e3d3b5;z-index:15}
.navbar-in{max-width:960px;margin:0 auto;padding:12px 18px;display:flex;gap:10px;align-items:center}
.navbar .sp{flex:1;text-align:center;color:var(--muted);font-size:.85rem}

/* choice rows */
.q{border:1px solid #eadbc2;border-radius:14px;padding:12px 14px;margin:10px 0;background:var(--cream)}
.q .txt{font-weight:700;margin-bottom:8px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:2px solid var(--burg);background:#fff;color:var(--burg);border-radius:10px;padding:8px 14px;font-weight:900;min-width:56px}
.opt.S{border-color:var(--orange);color:var(--orange)} .opt.M{border-color:var(--teal);color:var(--teal)} .opt.L{border-color:var(--burg);color:var(--burg)}
.opt.picked.right{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.picked.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:8px;font-size:.95rem;min-height:1em}
.fb.ok{color:var(--ok);font-weight:700}.fb.no{color:var(--bad);font-weight:700}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}

.zone{border-radius:16px;padding:14px;color:#fff}
.zone h3{color:#fff;margin:0}
.zone.S{background:var(--orange)} .zone.M{background:var(--teal)} .zone.L{background:var(--burg)}
.zone p{margin:.3em 0;font-size:.95rem}

.dg{border-radius:16px;padding:16px}
.dg.dream{background:#f4ecf8;border:2px solid #b493c4}
.dg.goal{background:#eaf5ef;border:2px solid var(--ok)}
.dg .say{font-family:"Playfair Display",serif;font-size:1.2rem;margin:.3em 0}

/* story */
.story{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start}
.story img{width:100%;border-radius:14px;display:block}
@media(max-width:720px){.story{grid-template-columns:1fr}}
.reveal{border:2px solid var(--gold);background:#fff;border-radius:12px;padding:10px 14px;margin:8px 0;width:100%;text-align:left}
.reveal .ans{display:none;color:var(--teal);font-weight:700;margin-top:4px}
.reveal.open .ans{display:block}

/* SMART */
.flip{perspective:900px;height:200px;cursor:pointer;background:none;border:none;padding:0}
.flip-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;text-align:center}
.face.front{background:var(--burg);color:#fff}
.face.front .L{font-family:"Playfair Display",serif;font-size:3.4rem;color:var(--gold);line-height:1}
.face.front .w{font-weight:900;font-size:1.1rem}
.face.back{background:var(--gold-l);color:var(--burg-d);transform:rotateY(180deg);border:2px solid var(--gold)}
.face.back .qq{font-weight:900}
.face small{opacity:.8;font-size:.75rem;margin-top:6px}

/* calc */
.formula{background:var(--burg);color:#fff;border-radius:14px;padding:14px 18px;font-weight:900;text-align:center;font-size:1.1rem}
.formula b{color:var(--gold)}
.calc{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:1.15rem;font-weight:700;margin:12px 0}
.calc input{width:120px;padding:8px 10px;border:2px solid var(--burg);border-radius:10px;font-weight:700;text-align:center}
.calc .res{background:var(--gold);color:var(--burg-d);border-radius:10px;padding:8px 14px;min-width:120px;text-align:center}
.counting{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.counting span{background:var(--beige);border-radius:6px;padding:2px 6px;font-size:.8rem;color:var(--muted)}

/* Goal-O-Meter */
.gom{display:grid;grid-template-columns:1.2fr 1fr;gap:22px}
@media(max-width:760px){.gom{grid-template-columns:1fr}}
.field{margin:10px 0}
.field label{display:block;font-weight:900;color:var(--burg);font-size:.9rem}
.field label .L{display:inline-block;background:var(--burg);color:var(--gold);border-radius:6px;width:26px;text-align:center;margin-right:6px;font-family:"Playfair Display",serif}
.field input,.field textarea{width:100%;padding:9px 12px;border:2px solid #dcc8a4;border-radius:10px;background:#fff}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--gold)}
.thermo{display:flex;gap:14px;align-items:flex-end;justify-content:center}
.tube{display:flex;flex-direction:column-reverse;width:84px;border:4px solid var(--burg);border-bottom:none;border-radius:42px 42px 0 0;overflow:hidden;background:#fff}
.seg{height:38px;border-top:2px dashed #e6d6b8;background:#fff;border-left:none;border-right:none;border-bottom:none;padding:0;transition:background .3s}
.seg.fill{background:linear-gradient(90deg,#c0392b,#e05a3a)}
.bulb{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff7a59,#b3241b);border:4px solid var(--burg);margin-top:-6px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;text-align:center;font-size:.85rem;padding:8px}
.labels{display:flex;flex-direction:column-reverse;padding-bottom:114px;font-size:.8rem;font-weight:700;color:var(--muted)}
.labels div{height:38px;display:flex;align-items:center}
.thermo-col{display:flex;flex-direction:column;align-items:center}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.boxes div{background:var(--cream);border:1.5px solid #e2cfa9;border-radius:10px;padding:8px 10px;font-size:.85rem}
.boxes b{display:block;color:var(--burg);font-size:1rem}
.cheer{background:var(--teal);color:#fff;border-radius:14px;padding:12px 16px;font-weight:700;margin-top:12px}

/* badge */
.badge-wrap{text-align:center}
.badge{width:220px;height:220px;border-radius:50%;margin:10px auto;background:radial-gradient(circle,var(--gold-l) 0 55%,var(--gold) 56% 70%,var(--burg) 71%);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(91,18,41,.25);transform:scale(.2);opacity:0;transition:all .7s cubic-bezier(.2,1.5,.4,1)}
.badge.show{transform:scale(1);opacity:1}
.badge .t{font-family:"Playfair Display",serif;font-weight:800;color:var(--burg);font-size:1.5rem;line-height:1.1}
.badge .n{font-weight:900;color:var(--burg-d);margin-top:4px}
.mission{background:var(--burg);color:#fff;border-radius:16px;padding:16px 20px;margin-top:16px}
.mission h3{color:var(--gold)}
.check{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.check input{width:22px;height:22px;margin-top:3px;accent-color:var(--burg)}

.toast{position:fixed;left:50%;top:80px;transform:translateX(-50%) translateY(-20px);background:var(--gold);color:var(--burg-d);font-weight:900;border-radius:999px;padding:10px 22px;box-shadow:0 6px 20px rgba(0,0,0,.2);opacity:0;transition:all .3s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.timer{font-weight:900;color:var(--burg);background:var(--gold-l);border-radius:999px;padding:2px 10px;font-size:.85rem}
.small{font-size:.88rem;color:var(--muted)}
textarea{min-height:70px;resize:vertical}
.copyrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
@media(max-width:600px){
 body{font-size:17px} h1{font-size:1.7rem} h2{font-size:1.45rem}
 .brand small{display:none} .top-in{padding:8px 12px;gap:8px} .tbtn{font-size:.75rem;padding:3px 9px}
 .map{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px} .dot{white-space:nowrap}
 .card{padding:16px 14px} .navbar-in{padding:10px 12px} .navbar .sp{font-size:.75rem}
 .opt{padding:10px 12px;flex:1 1 auto}
}
</style>
</head>
<body>
<div class="top">
  <div class="top-in">
    <div class="brand">Japesh Campus · Goal Getter<small>MODULE 4 · GOAL SETTING · ONE-TO-ONE ONLINE LESSON</small></div>
    <button class="tbtn" id="tToggle" title="Show what the trainer says at each step">Trainer notes: off</button>
    <div class="stars">⭐ <b id="starCount">0</b> stars</div>
  </div>
  <div class="prog"><i id="progBar"></i></div>
</div>

<div class="wrap">
  <div class="map" id="map"></div>
  <div id="stage"></div>
</div>

<div class="navbar"><div class="navbar-in">
  <button class="btn ghost" id="backBtn">← Back</button>
  <div class="sp" id="stepLbl"></div>
  <button class="btn" id="nextBtn">Next →</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
/* ------------ state ------------ */
const S = {step:0, stars:0, name:"", dream:"", earned:{}, gom:{what:"",cost:"",save:"",why:"",place:"",filled:0}, teacher:false};
function load(){try{const d=JSON.parse(localStorage.getItem("jc_m4")||"null");if(d)Object.assign(S,d);}catch(e){}}
function save(){try{localStorage.setItem("jc_m4",JSON.stringify(S));}catch(e){}}
load();

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nm=()=>S.name?esc(S.name):"Goal Getter";
const ksh=n=>"KSh "+Number(n).toLocaleString("en-KE");

function star(key,n=1){
  if(S.earned[key])return; S.earned[key]=true; S.stars+=n; $("#starCount").textContent=S.stars; save();
  toast("+"+n+" ⭐ "+["Great job!","You're on fire!","Goal Getter power!","Brilliant!","Keep going!"][Math.floor(Math.random()*5)]);
}
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1600);}

/* generic multiple-choice row builder */
function mcRow(id,text,options,correct,fbRight,fbWrong,opts={}){
  // correct: array of accepted option values
  return `<div class="q" data-q="${id}"><div class="txt">${text}</div><div class="opts">${
    options.map(o=>`<button class="opt ${opts.cls?o.v:""}" data-v="${esc(o.v)}">${o.l}</button>`).join("")
  }</div><div class="fb"></div></div>`;
}
function wireMC(root,data,starKey){
  // data: {id:{correct:[...], right:"", wrong:""}}
  root.querySelectorAll(".q[data-q]").forEach(q=>{
    const d=data[q.dataset.q]; if(!d)return;
    q.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(q.dataset.solved)return;
      const ok=d.correct.includes(b.dataset.v);
      b.classList.add("picked",ok?"right":"wrong");
      const fb=q.querySelector(".fb");
      if(ok){q.dataset.solved=1;fb.className="fb ok";fb.innerHTML="✔ "+d.right;q.querySelectorAll(".opt").forEach(x=>x.disabled=true);
        if(root.querySelectorAll(".q[data-q]").length===root.querySelectorAll(".q[data-solved]").length && starKey){star(starKey);}
      } else {fb.className="fb no";fb.innerHTML="Not quite. "+(d.wrong||"Try again!");setTimeout(()=>b.classList.remove("picked","wrong"),900);}
    });
  });
}

/* ------------ steps ------------ */
const steps = [
/* 0 WELCOME */
{tab:"Welcome",min:2,render:()=>`
<div class="card">
  <span class="kicker">Module 4 · Book 2 · Day 2</span>
  <h1>Goal Setting: Turning Your Dreams Into a Plan</h1>
  <p class="lead">Welcome back, Effort Earner! This morning you learned how people <b>earn</b> money. But what do you <b>do</b> with the money you earn? Today you will turn your biggest dream into a real plan. By the end, you'll be a <b>GOAL GETTER!</b></p>
  <div class="field" style="max-width:380px"><label>What is your name?</label><input id="nameIn" placeholder="Type your name" value="${esc(S.name)}"></div>
  <h3>Today's missions</h3>
  <div class="grid g3">
    ${[["⚡","Warm-up game","Short, Medium or Long?"],["📖","Story time","Tendo's huge dream"],["💭","Dream or Goal?","Spot the difference"],["⏳","Goal sizes","Short, medium, long"],["🎯","Make it SMART","5 secret letters"],["🧮","Plan your steps","Work out the weeks"],["🏀","Bounce Back!","What to do when things go wrong"],["🌡️","My Goal-O-Meter","Build your own"],["🏆","Quiz and badge","Earn Goal Getter"]].map(x=>`<div class="q" style="margin:0"><div style="font-size:1.6rem">${x[0]}</div><b>${x[1]}</b><div class="small">${x[2]}</div></div>`).join("")}
  </div>
  <p class="small" style="margin-top:14px">You need: Book 2 (pages 17–30), a pencil, colours, and a piece of paper for your Goal-O-Meter. Collect ⭐ stars as you go!</p>
</div>
<div class="notes"><h4>Trainer notes · 2 min</h4>
<p><b>Teaching goal:</b> by the end the learner says, “A dream is a wish. A goal is a dream with a plan, and I have one!”</p>
<p><b>Set-up online:</b> share your screen, or send the learner this link and both open it. Give the learner control of the clicks wherever you can; you guide with questions.</p>
<p><b>One student, so:</b> you are the partner for every “share with a partner” moment. Keep praise specific (“I love how you said WHY!”).</p>
<p>Protect the time for the Goal-O-Meter (20 min). If you run late, Money Math and Big Thinker can go home.</p></div>`,
after:()=>{const i=$("#nameIn");i.oninput=()=>{S.name=i.value.trim();save();};}},

/* 1 ENERGIZER */
{tab:"Warm-up",min:5,render:()=>`
<div class="card">
  <div class="meta"><span class="kicker">Energizer</span><span class="pill">No book yet</span><span class="pill">5 min</span></div>
  <h2>⚡ Short, Medium or Long?</h2>
  <p>I call out a goal. You tap <b>S</b>, <b>M</b> or <b>L</b>, then say <b>WHY</b> out loud!</p>
  <div class="grid g3" style="margin-bottom:10px">
    <div class="zone S"><h3>SHORT</h3><p>Days or weeks</p></div>
    <div class="zone M"><h3>MEDIUM</h3><p>Months</p></div>
    <div class="zone L"><h3>LONG</h3><p>Years</p></div>
  </div>
  <div id="energ">${ENERG.map((e,i)=>mcRow("e"+i,(i+1)+". "+e[0],[{v:"S",l:"S"},{v:"M",l:"M"},{v:"L",l:"L"}],null,null,null,{cls:1})).join("")}</div>
  <div class="big-quote">Some goals take longer than others. The important thing is to have a PLAN!</div>
</div>
<div class="notes"><h4>Trainer notes · 5 min</h4>
<p><b>Say:</b> “Let's warm up! I'll call out a goal. Is it SHORT (days or weeks), MEDIUM (months) or LONG (years)? Tap your answer, then tell me WHY.”</p>
<p>Read each goal aloud. After each answer ask “Why?” and praise every reason.</p>
<p><b>“Why?” round:</b> for “Save for a bicycle”, ask: “Could it ever be short? What would make it take longer?”</p>
<p>“Learn to ride a bike” accepts S or M: it depends how fast you learn!</p></div>`,
after:()=>{const d={};ENERG.forEach((e,i)=>d["e"+i]={correct:e[1],right:e[2]});wireMC($("#energ"),d,"energ");}},

/* 2 STORY */
{tab:"Story",min:5,render:()=>`
<div class="card">
  <div class="meta"><span class="kicker">Story time</span><span class="pill">Open Book 2 · p.17–18</span><span class="pill">5 min</span></div>

      <p>Tendo and Baraka sit on the front step at sunset. Baraka wants to be a footballer… or a pilot… or both!</p>
      <p>Tendo says, <b>“I want to build something that lasts,”</b> something people will still use when he is old.</p>
      <p>Baraka laughs: <b>“That's a HUGE dream! How do you even start?”</b></p>
      <p>Tendo admits he doesn't know yet, “but big dreams are the only ones worth having.”</p>

{tab:"Plan steps",min:6,render:()=>`

  <div class="q"><div class="txt">A goal costs KSh 1,000. You save KSh 50 a week. How many weeks?</div>
    <div class="calc" style="margin:0"><input id="p1" type="number" placeholder="?"> weeks <button class="btn gold" id="p1b" type="button">Check</button></div><div class="fb" id="p1f"></div></div>
  <div class="grid g2" style="margin-top:14px">
    <div class="q" style="margin:0"><h3>📈 Track your progress</h3>Colour a savings chart, fill in a thermometer, or add a sticker each time you get closer. Soon you'll make your own <b>Goal-O-Meter!</b></div>
    <div class="q" style="margin:0;background:#fdeee2;border-color:var(--orange)"><h3>💪 Be resilient!</h3>Setbacks happen to everyone. If something goes wrong, don't give up. <b>Adjust your plan and keep going!</b></div>

  <div id="brian">${mcRow("b0","What should Brian do?",[{v:"a",l:"Give up. It's too expensive now."},{v:"b",l:"Adjust the plan: keep saving KSh 60 for a few more weeks."},{v:"c",l:"Buy sweets with the KSh 360 instead."}])}</div>
  <p id="brianEnd" style="display:none" class="q">Brian saved KSh 60 for three more weeks. On his grandmother's birthday he handed her the shawl himself. She didn't know it took thirteen weeks instead of ten. She only knew her grandson had thought of her. ❤️</p>

function renderMap(){
  $("#map").innerHTML=steps.map((s,i)=>`<button class="dot ${i===S.step?"cur":""} ${i<S.step?"done":""}" data-i="${i}">${i+1}. ${s.tab}</button>`).join("");
  $("#map").querySelectorAll(".dot").forEach(b=>b.onclick=()=>go(+b.dataset.i));
}
function go(i){
  S.step=Math.max(0,Math.min(steps.length-1,i));save();
  const st=steps[S.step];
  $("#stage").innerHTML=st.render(); if(st.after)st.after();
  renderMap();
  $("#progBar").style.width=(S.step/(steps.length-1)*100)+"%";
  $("#stepLbl").innerHTML=`Step ${S.step+1} of ${steps.length} · <span class="timer">⏱ about ${st.min} min</span>`;
  $("#backBtn").disabled=S.step===0;
  $("#nextBtn").textContent=S.step===steps.length-1?"Start again ↺":"Next →";
  window.scrollTo({top:0,behavior:"smooth"});
}
$("#backBtn").onclick=()=>go(S.step-1);

  } else go(S.step+1);
};
